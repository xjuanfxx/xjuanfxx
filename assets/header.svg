<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="JuanFX — motion design, After Effects plugins and beats">
  <title>JuanFX — motion design, After Effects plugins and beats</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1B26"/>
      <stop offset="1" stop-color="#0B0C12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7B5CFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7B5CFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="20"/></clipPath>
    <clipPath id="slice"><rect x="0" y="150" width="1200" height="26"/></clipPath>
    <text id="word" x="600" y="214" text-anchor="middle">JUANFX</text>
  </defs>
  <style>
    .word { font: italic 900 150px 'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -4px; }
    .sub  { font: 700 19px 'JetBrains Mono', 'Cascadia Code', Consolas, 'Courier New', monospace; letter-spacing: 7px; fill: #A4A7BC; }
    .lime   { animation: jolt-l 4.2s steps(1) infinite; }
    .violet { animation: jolt-v 4.2s steps(1) infinite; }
    .cut    { animation: jolt-c 4.2s steps(1) infinite; }
    .tick   { animation: blink 4.2s steps(1) infinite; }
    .scan   { animation: scan 6s linear infinite; }
    @keyframes jolt-l { 0% { transform: translate(-7px,0); } 62% { transform: translate(-22px,2px); } 66% { transform: translate(-4px,-1px); } 70% { transform: translate(-7px,0); } 88% { transform: translate(-14px,0); } 90% { transform: translate(-7px,0); } }
    @keyframes jolt-v { 0% { transform: translate(7px,0); } 62% { transform: translate(24px,-2px); } 66% { transform: translate(3px,1px); } 70% { transform: translate(7px,0); } 88% { transform: translate(15px,0); } 90% { transform: translate(7px,0); } }
    @keyframes jolt-c { 0% { transform: translate(0,0); opacity: 0; } 62% { transform: translate(34px,0); opacity: 1; } 66% { transform: translate(-18px,0); opacity: 1; } 70% { transform: translate(0,0); opacity: 0; } }
    @keyframes blink { 0% { opacity: .9; } 62% { opacity: .2; } 70% { opacity: .9; } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(360px); } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <ellipse cx="600" cy="170" rx="520" ry="190" fill="url(#glow)"/>
    <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="2">
      <line x1="0" y1="96" x2="1200" y2="96"/><line x1="0" y1="112" x2="1200" y2="112"/>
      <line x1="0" y1="236" x2="1200" y2="236"/><line x1="0" y1="252" x2="1200" y2="252"/>
    </g>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#ffffff" opacity="0.05"/>

    <use href="#word" class="word lime" fill="#B8FF2E" opacity="0.9"/>
    <use href="#word" class="word violet" fill="#7B5CFF" opacity="0.9"/>
    <use href="#word" class="word" fill="#F5F2EA"/>
    <g clip-path="url(#slice)"><g class="cut">
      <rect x="0" y="150" width="1200" height="26" fill="#14151D"/>
      <use href="#word" class="word" fill="#F5F2EA"/>
    </g></g>

    <g class="tick" fill="#F5F2EA">
      <rect x="958" y="146" width="64" height="9" rx="4.5"/>
      <rect x="982" y="164" width="36" height="9" rx="4.5" opacity="0.55"/>
      <rect x="168" y="190" width="40" height="9" rx="4.5" opacity="0.55"/>
    </g>

    <text x="600" y="276" text-anchor="middle" class="sub">MOTION DESIGN · AFTER EFFECTS PLUGINS · BEATS</text>
  </g>
</svg>
