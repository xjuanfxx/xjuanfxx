<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="JuanFX — motion design, After Effects plugins and beats">
  <title>JuanFX — motion design, After Effects plugins and beats</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1E2E"/>
      <stop offset="1" stop-color="#11111B"/>
    </linearGradient>
    <!-- glass panel: faint fill, brighter towards the top edge -->
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#CBA6F7" stop-opacity="0.3"/>
    </linearGradient>
    <!-- the name's fill slides slowly through lavender, pink and blue -->
    <linearGradient id="ink" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#CBA6F7"/>
      <stop offset="0.35" stop-color="#F5C2E7"/>
      <stop offset="0.7" stop-color="#B4BEFE"/>
      <stop offset="1" stop-color="#CBA6F7"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 600 0; 0 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="46"/></filter>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="28"/></clipPath>
    <path id="spark" d="M0 -22 C3 -6 6 -3 22 0 C6 3 3 6 0 22 C-3 6 -6 3 -22 0 C-6 -3 -3 -6 0 -22 Z"/>
  </defs>
  <style>
    .name { font: 800 132px 'Nunito', 'Segoe UI', 'SF Pro Rounded', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -2px; }
    .sub  { font: 600 18px 'Nunito', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: 6px; fill: #A6ADC8; }
    .b1 { animation: drift1 14s ease-in-out infinite alternate; }
    .b2 { animation: drift2 17s ease-in-out infinite alternate; }
    .b3 { animation: drift3 12s ease-in-out infinite alternate; }
    .float { animation: float 6s ease-in-out infinite; }
    .twinkle { transform-box: fill-box; transform-origin: center; animation: twinkle 3.2s ease-in-out infinite; }
    .t2 { animation-delay: 1.4s; }
    .shine { animation: shine 7s ease-in-out infinite; }
    @keyframes drift1 { to { transform: translate(180px, 40px) scale(1.15); } }
    @keyframes drift2 { to { transform: translate(-200px, -30px) scale(0.9); } }
    @keyframes drift3 { to { transform: translate(-90px, 50px) scale(1.2); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; } 50% { transform: scale(0.55) rotate(45deg); opacity: 0.5; } }
    @keyframes shine { 0%, 60% { transform: translateX(-500px); } 100% { transform: translateX(1500px); } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- liquid blobs behind the glass -->
    <g filter="url(#blur)">
      <circle class="b1" cx="300" cy="90" r="150" fill="#CBA6F7" opacity="0.55"/>
      <circle class="b2" cx="900" cy="240" r="170" fill="#F5C2E7" opacity="0.4"/>
      <circle class="b3" cx="640" cy="40" r="110" fill="#89B4FA" opacity="0.35"/>
    </g>

    <!-- glass card -->
    <g class="float">
      <rect x="150" y="44" width="900" height="232" rx="40" fill="url(#glass)"/>
      <rect x="150.75" y="44.75" width="898.5" height="230.5" rx="39.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
      <clipPath id="card"><rect x="150" y="44" width="900" height="232" rx="40"/></clipPath>
      <g clip-path="url(#card)">
        <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
          <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.09"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
        <g transform="skewX(-20)"><rect class="shine" x="0" y="0" width="180" height="320" fill="url(#streak)"/></g>
      </g>

      <text x="600" y="186" text-anchor="middle" class="name" fill="#CBA6F7" opacity="0.5" filter="url(#soft)">JuanFX</text>
      <text x="600" y="186" text-anchor="middle" class="name" fill="url(#ink)">JuanFX</text>
      <text x="600" y="238" text-anchor="middle" class="sub">MOTION DESIGN · AFTER EFFECTS PLUGINS · BEATS</text>

      <g transform="translate(262 98)"><use href="#spark" class="twinkle" fill="#F5E0DC"/></g>
      <g transform="translate(958 214) scale(0.6)"><use href="#spark" class="twinkle t2" fill="#F5C2E7"/></g>
      <circle cx="990" cy="86" r="7" fill="#CBA6F7" opacity="0.8"/>
    </g>
  </g>
</svg>
